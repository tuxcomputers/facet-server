[project]
name = "facet-server"
version = "0.1.0"
description = "Multi-user sync and reporting backend for Facet"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facet_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "ANN",  # missing type annotations
    "RUF",
]
ignore = [
    "ANN401",  # typing.Any in an argument, occasionally the honest type
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["ANN"]  # generated revision stubs

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
# The alembic/ directory at the repo root would otherwise make ruff read the alembic library
# itself as first-party and split it into its own import block.
known-first-party = ["facet_server"]
known-third-party = ["alembic"]
